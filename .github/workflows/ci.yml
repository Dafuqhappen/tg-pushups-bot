name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # config.py требует токен и чат; тесты в сеть не ходят и БД не пишут.
      BOT_TOKEN: "test:token"
      CHAT_ID: "-100"
      DB_PATH: /tmp/ci-never-written.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m tests.test_streak_rules
      - run: python -m tests.test_timezones
